<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffaf2"/>
    <stop offset="1" stop-color="#f7ead8"/>
  </linearGradient>
  <linearGradient id="calf" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d98b4a"/>
    <stop offset="1" stop-color="#9f542d"/>
  </linearGradient>
  <linearGradient id="beaver" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9a633f"/>
    <stop offset="1" stop-color="#5a3628"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6b442f" flood-opacity=".18"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
</defs>

<rect width="900" height="1200" rx="42" fill="url(#bg)"/>
<circle cx="120" cy="130" r="44" fill="#f2c8b5" opacity=".24"/>
<circle cx="785" cy="160" r="58" fill="#f0d7a3" opacity=".28"/>
<circle cx="775" cy="675" r="75" fill="#f1c5b8" opacity=".15"/>

<g fill="#d85c62" opacity=".8">
  <path d="M118 236c-19-27-62-9-52 22 7 22 52 52 52 52s45-30 52-52c10-31-33-49-52-22z"/>
  <path d="M752 306c-12-18-41-6-34 15 5 14 34 34 34 34s29-20 34-34c7-21-22-33-34-15z"/>
</g>

<!-- ground -->
<ellipse cx="450" cy="790" rx="330" ry="80" fill="#dfc8a9" opacity=".45"/>

<!-- calf -->
<g filter="url(#shadow)">
  <ellipse cx="345" cy="655" rx="150" ry="205" fill="url(#calf)"/>
  <ellipse cx="345" cy="425" rx="145" ry="128" fill="url(#calf)"/>
  <ellipse cx="230" cy="398" rx="78" ry="43" fill="#b96b3b" transform="rotate(-18 230 398)"/>
  <ellipse cx="460" cy="398" rx="78" ry="43" fill="#b96b3b" transform="rotate(18 460 398)"/>
  <ellipse cx="345" cy="478" rx="98" ry="63" fill="#c78364"/>
  <ellipse cx="318" cy="470" rx="10" ry="7" fill="#7d4737"/>
  <ellipse cx="372" cy="470" rx="10" ry="7" fill="#7d4737"/>
  <ellipse cx="292" cy="413" rx="22" ry="28" fill="#241b19"/>
  <ellipse cx="398" cy="413" rx="22" ry="28" fill="#241b19"/>
  <circle cx="285" cy="404" r="7" fill="#fff" opacity=".9"/>
  <circle cx="391" cy="404" r="7" fill="#fff" opacity=".9"/>
  <path d="M308 512q37 20 74 0" fill="none" stroke="#754334" stroke-width="7" stroke-linecap="round"/>
  <rect x="258" y="732" width="62" height="165" rx="30" fill="#a95d36"/>
  <rect x="370" y="732" width="62" height="165" rx="30" fill="#a95d36"/>
  <!-- fluffy tufts -->
  <g fill="none" stroke="#efa266" stroke-width="8" stroke-linecap="round" opacity=".55">
    <path d="M285 337q18-20 36 0M325 327q18-21 36 0M365 333q18-19 36 0"/>
    <path d="M252 578q22-18 42 0M322 555q22-18 42 0M386 585q20-17 38 0"/>
  </g>
</g>

<!-- beaver tail -->
<ellipse cx="678" cy="785" rx="82" ry="145" fill="#4f3027" transform="rotate(25 678 785)" opacity=".92"/>
<g stroke="#7c5445" stroke-width="5" opacity=".6">
  <path d="M627 693l92 163M605 725l93 163M649 676l84 151"/>
  <path d="M607 772l92-38M621 814l91-38M639 852l83-35"/>
</g>

<!-- beaver -->
<g filter="url(#shadow)">
  <ellipse cx="590" cy="690" rx="140" ry="190" fill="url(#beaver)"/>
  <ellipse cx="585" cy="510" rx="126" ry="112" fill="url(#beaver)"/>
  <circle cx="492" cy="447" r="31" fill="#6b4230"/>
  <circle cx="678" cy="447" r="31" fill="#6b4230"/>
  <ellipse cx="585" cy="545" rx="84" ry="57" fill="#b58769"/>
  <ellipse cx="585" cy="515" rx="33" ry="25" fill="#2b211f"/>
  <ellipse cx="540" cy="490" rx="16" ry="19" fill="#211918"/>
  <ellipse cx="630" cy="490" rx="16" ry="19" fill="#211918"/>
  <circle cx="535" cy="484" r="5" fill="#fff"/>
  <circle cx="625" cy="484" r="5" fill="#fff"/>
  <rect x="565" y="561" width="20" height="31" rx="5" fill="#fff9e9" stroke="#d5cbb6" stroke-width="2"/>
  <rect x="586" y="561" width="20" height="31" rx="5" fill="#fff9e9" stroke="#d5cbb6" stroke-width="2"/>
  <path d="M560 605q25 18 50 0" fill="none" stroke="#5b3a2e" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="535" cy="728" rx="34" ry="54" fill="#5b372b" transform="rotate(18 535 728)"/>
  <ellipse cx="642" cy="728" rx="34" ry="54" fill="#5b372b" transform="rotate(-18 642 728)"/>
</g>

<!-- shared scarf -->
<path d="M286 545 C355 600 470 601 543 566 C583 548 625 549 664 575"
      fill="none" stroke="#c94d54" stroke-width="34" stroke-linecap="round"/>
<path d="M477 581 C493 658 501 730 474 805"
      fill="none" stroke="#c94d54" stroke-width="31" stroke-linecap="round"/>
<g stroke="#f4c2bb" stroke-width="5">
  <path d="M465 793l-14 35M478 796l0 38M491 793l14 35"/>
</g>

<!-- little heart between them -->
<path d="M463 446c-16-23-52-7-43 19 6 19 43 44 43 44s37-25 43-44c9-26-27-42-43-19z" fill="#df5a63"/>

<!-- caption card -->
<rect x="82" y="935" width="736" height="190" rx="36" fill="#fff" opacity=".86"/>
<text x="450" y="1000" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700" fill="#7d473e">Любовь — это...</text>
<text x="450" y="1062" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#5e514b">согревать друг друга даже</text>
<text x="450" y="1103" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#5e514b">в самый обычный вечер.</text>
</svg>