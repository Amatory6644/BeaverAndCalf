name: Send comic to Telegram

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content/latest.svg"
      - "content/latest.jpg"
      - "content/caption.txt"

jobs:
  send-comic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send comic
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/send_to_telegram.py
